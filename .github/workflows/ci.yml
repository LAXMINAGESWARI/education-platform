name: CI

on:
  pull_request:
  push:
    branches:
      - cursor/k8s-autoscaling

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - uses: actions/cache@v4
        with:
          path: backend/.mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}-${{ hashFiles('backend/src/**/*.py') }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}-
            mypy-${{ runner.os }}-
      - run: uv run mypy src

  backend-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: education
          POSTGRES_PASSWORD: education
          POSTGRES_DB: education_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U education -d education_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://education:education@localhost:5432/education_test
      # libpq (psycopg, including `alembic upgrade`) waits forever unless this is set.
      # asyncpg does not read it; tests cap that driver in tests/postgres_connect.py.
      PGCONNECT_TIMEOUT: "5"
      PYTEST_SHARD: ${{ matrix.shard }}
      PYTEST_SHARD_COUNT: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --locked
      - name: Wait for Postgres
        run: |
          set -euo pipefail
          if ! command -v pg_isready >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client
          fi
          attempts=6
          for attempt in $(seq 1 "$attempts"); do
            if pg_isready -h localhost -p 5432 -U education -d education_test -t 5; then
              echo "Postgres is accepting connections on localhost:5432/education_test."
              exit 0
            fi
            echo "Postgres is not ready (attempt ${attempt}/${attempts})."
            if [ "$attempt" -lt "$attempts" ]; then
              sleep 1
            fi
          done
          echo "::error::Postgres did not become ready after ${attempts} attempts (5s connect timeout each). localhost:5432/education_test is unreachable."
          exit 1
      - run: uv run alembic upgrade head
      - run: uv run pytest -n 4 --dist loadfile -m "not ml" --cov-fail-under=0
      - name: Save shard coverage
        run: mv .coverage coverage.shard-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-fast-${{ matrix.shard }}
          path: backend/coverage.shard-${{ matrix.shard }}
          if-no-files-found: error

  backend-ml:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: education
          POSTGRES_PASSWORD: education
          POSTGRES_DB: education_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U education -d education_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://education:education@localhost:5432/education_test
      PGCONNECT_TIMEOUT: "5"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --locked
      - name: Wait for Postgres
        run: |
          set -euo pipefail
          if ! command -v pg_isready >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client
          fi
          attempts=6
          for attempt in $(seq 1 "$attempts"); do
            if pg_isready -h localhost -p 5432 -U education -d education_test -t 5; then
              echo "Postgres is accepting connections on localhost:5432/education_test."
              exit 0
            fi
            echo "Postgres is not ready (attempt ${attempt}/${attempts})."
            if [ "$attempt" -lt "$attempts" ]; then
              sleep 1
            fi
          done
          echo "::error::Postgres did not become ready after ${attempts} attempts (5s connect timeout each). localhost:5432/education_test is unreachable."
          exit 1
      - run: uv run alembic upgrade head
      - run: uv run pytest -n 4 --dist loadfile -m ml --cov-fail-under=0
      - name: Save ml coverage
        run: mv .coverage coverage.ml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-ml
          path: backend/coverage.ml
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend-fast, backend-ml]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: backend/coverage-parts
          merge-multiple: true
      - name: Combine coverage and enforce 80%
        run: |
          set -euo pipefail
          uv run coverage combine \
            coverage-parts/coverage.shard-0 \
            coverage-parts/coverage.shard-1 \
            coverage-parts/coverage.ml
          uv run coverage report --fail-under=80

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.17.3
      - name: Install kubeconform, helm-unittest, and shellcheck
        run: |
          curl -sSL -o kubeconform.tgz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tgz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.8.2
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Lint and render the CurioEd chart
        run: deploy/helm/curioed/render-check.sh
      - name: kubeconform default, all-on, prod, and loadtest
        run: |
          set -eu
          chart=deploy/helm/curioed
          conform() {
            kubeconform -strict -ignore-missing-schemas -kubernetes-version 1.31.0 -summary
          }
          tag=(--set api.image.tag=ci --set web.image.tag=ci)
          helm template curioed "$chart" -n curioed "${tag[@]}" | conform
          helm template curioed "$chart" -n curioed \
            --set workers.llm.enabled=true \
            --set curriculumSeed.enabled=true \
            --set networkPolicy.enabled=true \
            --set priorityClass.enabled=true \
            --set keda.llm.enabled=true \
            --set keda.docling.enabled=true \
            --set web.autoscaling.enabled=true \
            "${tag[@]}" \
            | conform
          helm template curioed "$chart" -n curioed -f "$chart/values-prod.yaml" | conform
          helm template curioed "$chart" -n curioed-loadtest -f "$chart/values-loadtest.yaml" | conform
      - name: helm-unittest
        run: helm unittest deploy/helm/curioed
      - name: shellcheck
        run: shellcheck deploy/k8s/*.sh deploy/loadtest/collect.sh
      - name: Autodeploy checkout
        run: deploy/k8s/k8s-autodeploy_test.sh
      # aquasecurity/setup-trivy v0.3.1. Trivy v0.58.1 was removed and its install URL 404s.
      - name: Install Trivy
        continue-on-error: true
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.0
      - name: Scan base images
        continue-on-error: true
        run: |
          trivy image --exit-code 0 --severity HIGH,CRITICAL \
            python:3.12-slim-bookworm \
            nginx:1.27-alpine \
            cloudflare/cloudflared:2026.10.1 \
            ghcr.io/cloudnative-pg/postgresql:16.15-standard-bookworm

  quality:
    runs-on: ubuntu-latest
    # Aggregator only: this job reads `needs` and does not run pytest.
    # Do not copy this limit onto a job that runs the suite.
    timeout-minutes: 5
    if: always()
    needs: [lint, backend-fast, backend-ml, coverage, frontend, helm]
    permissions:
      contents: read
    steps:
      - name: Require every needed job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS_JSON"
          bad="$(echo "$NEEDS_JSON" | jq -r '
            to_entries[]
            | select(.value.result != "success")
            | "\(.key)=\(.value.result // "missing")"
          ')"
          if [ -n "$bad" ]; then
            echo "::error::Needed jobs must all be success. Skipped, cancelled, and failure fail this job."
            echo "$bad"
            exit 1
          fi
          echo "All needed jobs succeeded."
