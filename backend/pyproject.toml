[project]
name = "education-platform"
version = "0.1.0"
description = "CurioEd API — serve approved curriculum materials and quizzes"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15",
  "argon2-cffi>=23.1",
  "asyncpg>=0.30",
  "docling>=2.30",
  "email-validator>=2.2",
  "fastapi>=0.115",
  "google-adk>=1.15.0",
  "httpx>=0.28",
  "langchain-core>=1.5.5",
  "langgraph>=1.2.11",
  "litellm>=1.70.0",
  "openai>=3.1.0",
  "pgvector>=0.3",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.8",
  "pyjwt[crypto]>=2.10",
  "python-multipart>=0.0.20",
  "sentence-transformers>=3.4",
  "sqlalchemy[asyncio]>=2.0",
  "sqlglot>=30.17.0",
  "tiktoken>=0.13.0",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pre-commit>=4.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/education_platform"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["education_platform", "evals"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
# Fixtures imported for reuse (`seeded`, `async_session`) are legitimately
# "redefined" as same-named test parameters -- that's how pytest fixture
# injection works, not an actual shadowing bug.
"tests/test_text_to_sql_row_level_security.py" = ["F811"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["education_platform"]

[[tool.mypy.overrides]]
module = [
  "asyncpg",
  "asyncpg.*",
  "docling",
  "docling.*",
  "docling_core",
  "docling_core.*",
  "pgvector",
  "pgvector.*",
  "sentence_transformers",
  "sentence_transformers.*",
  "langgraph",
  "langgraph.*",
  "langchain_core",
  "langchain_core.*",
  "tiktoken",
  "tiktoken.*",
  "torch",
  "torch.*",
  "google.adk",
  "google.adk.*",
  "google.genai",
  "google.genai.*",
  "litellm",
  "litellm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --cov=education_platform --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
markers = [
    "regression: key user journeys run on every PR",
]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["education_platform"]
concurrency = ["thread", "greenlet"]
omit = [
  "*/alembic/*",
  "*/modules/materials/seed.py",
  "*/db/session.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]
