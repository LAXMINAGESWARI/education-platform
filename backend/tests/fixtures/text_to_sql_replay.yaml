# Recorded model responses for compare.py --replay. No network.
# legacy is the main compose output (the model sentence). lean may render a table.
version: 1
cases:
  - id: scalar
    question: How many students do I teach?
    route: free_form
    rows:
      - student_count: 3
    legacy:
      natural_answer: The student count is 3.
      confidence: high
      provenance: No tables were queried.
    lean:
      natural_answer: The student count is 3.
      confidence: high
      provenance: No tables were queried.
  - id: P2
    question: What is the average score by subject for my class?
    route: free_form
    rows:
      - subject: Mathematics
        average_score_percent: 70
      - subject: Science
        average_score_percent: 73.33
    compose_completion: Mathematics averages 70 and Science averages 73.33.
    legacy:
      natural_answer: Mathematics averages 70 and Science averages 73.33.
