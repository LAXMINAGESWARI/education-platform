# Load-test overlay. Namespace curioed-loadtest. Release name curioed, so the
# mock Service is curioed-llm-mock in that namespace.

domain: loadtest.curioed.local

config:
  environment: production
  corsOrigins: '["http://loadtest.curioed.local"]'
  openRouterBaseUrl: http://curioed-llm-mock:8080/v1
  platformEnv:
    JEV_DECISIONS_URL: http://curioed-llm-mock:8080/api/alpha/decisions
    # Load test only. Prod leaves JEV_JUDGE_MODE unset (the app treats that
    # as shadow). off skips HttpJudge. The hardcoded decisions URL in
    # judge/client.py:46 and HttpJudge.decide at :92 is a Coder follow-up.
    JEV_JUDGE_MODE: "off"

# Same pool numbers as values.yaml. See the PR #200 comment there.
# No PgBouncer: LISTEN needs a direct connection. max_connections is 300.
dbPool:
  api:
    size: 5
    maxOverflow: 5
    timeoutSeconds: 30
    recycleSeconds: 1800
    textToSqlSize: 2
    textToSqlMaxOverflow: 3
  worker:
    size: 2
    maxOverflow: 2
    timeoutSeconds: 30
    recycleSeconds: 1800
    shutdownGraceSeconds: 25

api:
  image:
    repository: curioed-api
    tag: "6b7553c"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 60

web:
  image:
    repository: curioed-web
    tag: "6b7553c"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 60

workerDocling:
  enabled: false

workers:
  llm:
    enabled: false

migrate:
  enabled: false

curriculumSeed:
  enabled: false

cloudflared:
  enabled: false
  replicas: 0

cnpg:
  instances: 1
  parameters:
    max_connections: "300"
    shared_buffers: "512MB"
    effective_cache_size: "1GB"
    work_mem: "4MB"
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  backup:
    enabled: false

keda:
  llm:
    enabled: false
  docling:
    enabled: false
  api:
    enabled: false

# Limits overcommit on purpose. collect.sh aborting below 3Gi MemAvailable
# is the real guard. Prod and loadtest never run at the same time: loadtest
# is deleted before prod comes up.
quota:
  requestsMemory: 6Gi
  limitsMemory: 12Gi
  limitsCpu: "8"

caddyAlias:
  enabled: false

llmMock:
  enabled: true

demoData:
  enabled: true

loadtest:
  k6:
    enabled: true
