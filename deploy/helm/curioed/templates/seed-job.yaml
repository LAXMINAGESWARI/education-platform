{{- if .Values.curriculumSeed.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "curioed.seedName" . }}
  labels:
    {{- include "curioed.labels" . | nindent 4 }}
    app.kubernetes.io/component: seed
  annotations:
    helm.sh/hook: {{ .Values.curriculumSeed.hooks | quote }}
    helm.sh/hook-weight: {{ .Values.curriculumSeed.weight | quote }}
    helm.sh/hook-delete-policy: {{ .Values.curriculumSeed.deletePolicy | quote }}
spec:
  backoffLimit: {{ .Values.curriculumSeed.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.curriculumSeed.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "curioed.labels" . | nindent 8 }}
        app.kubernetes.io/component: seed
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- include "curioed.podSecurityContext" (dict "root" . "security" .Values.curriculumSeed.securityContext) | nindent 6 }}
      {{- with include "curioed.imagePullSecrets" . | trim }}
      {{- nindent 6 . }}
      {{- end }}
      {{- with include "curioed.scheduling" . | trim }}
      {{- nindent 6 . }}
      {{- end }}
      containers:
        - name: seed
          image: {{ include "curioed.imageRef" .Values.api.image }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- include "curioed.containerSecurityContext" (dict "root" . "security" .Values.curriculumSeed.securityContext "add" .Values.api.addCapabilities) | nindent 10 }}
          command: ["python", "-m", "education_platform.modules.materials.seed"]
          {{- include "curioed.envFrom" . | nindent 10 }}
          env:
            {{- include "curioed.appEnv" . | nindent 12 }}
          {{- $seedMounts := include "curioed.tmpVolumeMounts" (dict "root" . "security" .Values.curriculumSeed.securityContext) | trim }}
          {{- if $seedMounts }}
          volumeMounts:
            {{- $seedMounts | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.curriculumSeed.resources | nindent 12 }}
      {{- $seedVolumes := include "curioed.tmpVolumes" (dict "root" . "security" .Values.curriculumSeed.securityContext) | trim }}
      {{- if $seedVolumes }}
      volumes:
        {{- $seedVolumes | nindent 8 }}
      {{- end }}
{{- end }}
