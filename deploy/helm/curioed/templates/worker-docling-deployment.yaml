{{- if .Values.workerDocling.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "curioed.workerDoclingName" . }}
  labels:
    {{- include "curioed.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-docling
spec:
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  replicas: {{ .Values.workerDocling.replicas }}
  selector:
    matchLabels:
      {{- include "curioed.selectorLabels" (dict "root" . "component" "worker-docling") | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "curioed.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker-docling
        curioed.io/uploads: "true"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.workerDocling.terminationGracePeriodSeconds }}
      {{- include "curioed.podSecurityContext" (dict "root" . "security" .Values.workerDocling.securityContext) | nindent 6 }}
      {{- with include "curioed.priorityClassName" (dict "root" . "tier" "workers") }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with include "curioed.imagePullSecrets" . | trim }}
      {{- nindent 6 . }}
      {{- end }}
      {{- with include "curioed.scheduling" . | trim }}
      {{- nindent 6 . }}
      {{- end }}
      affinity:
        {{- include "curioed.uploadsAffinity" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "curioed.imageRef" .Values.api.image }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- include "curioed.containerSecurityContext" (dict "root" . "security" .Values.workerDocling.securityContext "add" .Values.api.addCapabilities) | nindent 10 }}
          # No liveness or readiness. A DB ping would kill a worker mid-parse,
          # and there is no Service. TODO: a heartbeat file.
          # SIGTERM: once Coder's worker image is deployed, the process releases
          # its lease. Until that image is running, Python is PID 1 and ignores it.
          args:
            - python
            - -m
            - education_platform.workers
          {{- include "curioed.envFrom" . | nindent 10 }}
          env:
            {{- include "curioed.appEnv" . | nindent 12 }}
            {{- include "curioed.dbPoolEnv" (dict "pool" .Values.dbPool.worker "worker" true) | nindent 12 }}
          volumeMounts:
            {{- include "curioed.dataVolumeMounts" . | nindent 12 }}
          resources:
            {{- toYaml .Values.workerDocling.resources | nindent 12 }}
      volumes:
        {{- include "curioed.dataVolumes" . | nindent 8 }}
{{- end }}
