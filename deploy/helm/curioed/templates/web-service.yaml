apiVersion: v1
kind: Service
metadata:
  name: {{ include "curioed.webName" . }}
  labels:
    {{- include "curioed.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
  selector:
    {{- include "curioed.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
