apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "curioed.fullname" . }}
  labels:
    {{- include "curioed.labels" . | nindent 4 }}
spec:
  hard:
    requests.memory: {{ .Values.quota.requestsMemory }}
    limits.memory: {{ .Values.quota.limitsMemory }}
    {{- with .Values.quota.limitsCpu }}
    limits.cpu: {{ . | quote }}
    {{- end }}
