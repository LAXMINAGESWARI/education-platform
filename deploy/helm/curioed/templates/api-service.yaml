apiVersion: v1
kind: Service
metadata:
  name: {{ include "curioed.apiName" . }}
  labels:
    {{- include "curioed.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
  selector:
    {{- include "curioed.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
