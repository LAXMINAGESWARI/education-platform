apiVersion: v1
kind: LimitRange
metadata:
  name: {{ include "curioed.fullname" . }}
  labels:
    {{- include "curioed.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        cpu: {{ .Values.quota.limitRange.defaultCpu }}
        memory: {{ .Values.quota.limitRange.defaultMemory }}
      defaultRequest:
        cpu: {{ .Values.quota.limitRange.defaultRequestCpu }}
        memory: {{ .Values.quota.limitRange.defaultRequestMemory }}
      max:
        cpu: {{ .Values.quota.limitRange.maxCpu }}
        memory: {{ .Values.quota.limitRange.maxMemory }}
