server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    port_in_redirect off;

    # Hashed Vite bundles can stay cached. HTML, the manifest, and the service
    # worker must revalidate so a main-branch deploy reaches installed phones.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # no-store is omitted on purpose: it can stop Chrome from installing sw.js.
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
